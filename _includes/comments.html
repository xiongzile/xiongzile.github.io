<section class="comments" aria-labelledby="comments-title">
  <h2 class="comments-title" id="comments-title">Discussion</h2>
  <p class="comments-status" role="status" aria-live="polite">Loading discussion…</p>
  <script
    src="https://utteranc.es/client.js"
    repo="xiongzile/xiongzile.github.io"
    issue-term="pathname"
    theme="preferred-color-scheme"
    crossorigin="anonymous"
    async>
  </script>
  <script>
    (() => {
      const section = document.currentScript.closest('.comments');
      const status = section.querySelector('.comments-status');
      const client = section.querySelector('script[src*="utteranc.es/client.js"]');
      let timeout;

      const showError = () => {
        window.clearTimeout(timeout);
        status.textContent = 'Discussion is taking longer than expected.';
        status.classList.add('comments-status-error');
      };

      const watchFrame = (frame) => {
        if (!frame || frame.dataset.loadingWatched) return;
        frame.dataset.loadingWatched = 'true';
        frame.addEventListener('load', () => {
          window.clearTimeout(timeout);
          status.remove();
        }, { once: true });
        frame.addEventListener('error', showError, { once: true });
      };

      const observer = new MutationObserver(() => {
        const frame = section.querySelector('.utterances-frame');
        if (!frame) return;
        observer.disconnect();
        watchFrame(frame);
      });

      observer.observe(section, { childList: true, subtree: true });
      watchFrame(section.querySelector('.utterances-frame'));
      timeout = window.setTimeout(showError, 15000);
      client.addEventListener('error', showError, { once: true });
    })();
  </script>
</section>
