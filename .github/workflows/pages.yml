name: Publish blog and analytics

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Check blog tools and analytics code
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --check assets/analytics.js
      - name: Update public analytics snapshot
        id: analytics
        continue-on-error: true
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: python3 scripts/sync_analytics.py
      - name: Report delayed statistics
        if: steps.analytics.outcome == 'failure'
        run: echo '::warning::Analytics refresh failed. Publishing the previous snapshot with its original timestamp.'
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Record published revision
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('_site/assets/build-info.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA']}) + '\n')
          PY
      - uses: actions/upload-pages-artifact@v4

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
