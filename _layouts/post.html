---
layout: default
---
<article class="reading-width">
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y 年 %-m 月 %-d 日' }}</time>
      {% if page.wip %}<span class="meta-separator" aria-hidden="true">·</span><span>WIP · 持续更新中</span>{% endif %}
    </div>
    <div class="post-tags">{% for tag in page.tags %}<a href="{{ '/tags.html' | relative_url }}#{{ tag | slugify }}">{{ tag | escape }}</a>{% endfor %}</div>
  </header>
  <div class="prose">{{ content }}</div>
  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}">← 所有文章</a>
    <a href="https://github.com/xiongzile/xiongzile.github.io/blob/main/{{ page.path | uri_escape }}">查看原文 ↗</a>
  </footer>
</article>
