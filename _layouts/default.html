<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="author" content="{{ site.author | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <script src="{{ '/assets/theme.js' | relative_url }}"></script>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>博客</a>
        <a href="{{ '/archive.html' | relative_url }}"{% if page.nav == 'archive' %} aria-current="page"{% endif %}>归档</a>
        <a href="{{ '/tags.html' | relative_url }}"{% if page.nav == 'tags' %} aria-current="page"{% endif %}>标签</a>
        <a href="{{ '/about.html' | relative_url }}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>关于</a>
        <button class="theme-toggle" type="button" aria-label="切换明暗主题" aria-pressed="false" hidden>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.6 13A8.7 8.7 0 0 1 11 3.4 8.8 8.8 0 1 0 20.6 13Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        </button>
      </nav>
    </header>
    <main id="main" class="wrapper {{ layout.main_class | default: 'page-main' }}" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer wrapper">
      <div class="footer-links">
        <a href="https://github.com/xiongzile">GitHub ↗</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </div>
      <p>© {{ site.time | date: '%Y' }} {{ site.author | escape }}</p>
    </footer>
  </body>
</html>
